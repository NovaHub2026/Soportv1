name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (context + static + unit + api e2e) + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      # Production builds are part of the phase-candidate profile locally; CI runs them too so a broken build
      # never waits for the next phase candidate (Cycle Audit 2, FND-0052).
      - run: npm run build
