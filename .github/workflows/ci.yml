name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (context + static + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
