# PostgreSQL 16 for the api test suites (PH-8.2, BL-019). Nothing here is a deployment.
# Usage (Git Bash):
#   docker compose -f docker/compose.test.yml up -d
#   SUPPORT_DATABASE_URL=postgres://postgres:orbit@localhost:5433/orbit_test npm run test:pg -w api
#   docker compose -f docker/compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
