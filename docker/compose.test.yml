# PostgreSQL 16 for the api test suites (PH-8.2, BL-019). Nothing here is a deployment; the throwaway password is
# fine because the port is published on 127.0.0.1 only (Cycle Audit 3).
# Usage (Git Bash):
#   docker compose -f docker/compose.test.yml up -d
#   SUPPORT_DATABASE_URL=postgres://postgres:orbit@localhost:55433/orbit_test npm run test:pg -w api
#   (set PG_TEST_PORT=<port> for both commands if 55433 is taken on the host)
#   docker compose -f docker/compose.test.yml down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit_test
    ports:
      # 55433 by default: 5433 is commonly held by a native PostgreSQL service (as on the Owner's host), and the
      # suites must never reach a real database. PG_TEST_PORT overrides it.
      - "127.0.0.1:${PG_TEST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbit_test"]
      interval: 2s
      timeout: 3s
      retries: 30
