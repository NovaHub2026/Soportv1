# Orbit Support — deployment shape (PH-8.3, docs/runbooks/DEPLOYMENT.md): PostgreSQL + API + web.
# A rehearsal and a reference, not a release. Safe by default (Cycle Audit 3):
# - the web is published on 127.0.0.1 only and the API is not published at all;
# - SUPPORT_ALLOW_SIMULATED_IDENTITY defaults to false, so the API refuses to start in production mode until you
#   set it to "true" in .env for a demo on this machine (DEC-0008) — Orbit's identity does not exist yet (BL-001).
# Copy .env.example to .env and set POSTGRES_PASSWORD before "docker compose up".
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-orbit_support}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit_support}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Reachable only on the compose network (not published); main.ts announces the non-loopback bind.
      SUPPORT_BIND: 0.0.0.0
      SUPPORT_DATABASE_URL: postgres://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orbit_support}
      SUPPORT_UPLOADS_DIR: /data/uploads
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SUPPORT_IDENTITY_PROVIDER: simulated
      # Demo switch (DEC-0008): false by default; "true" only for a demo on this machine.
      SUPPORT_ALLOW_SIMULATED_IDENTITY: ${SUPPORT_ALLOW_SIMULATED_IDENTITY:-false}
      SUPPORT_ORBIT_RECORDS: simulated
      SUPPORT_NOTIFICATION_INTERVAL_MS: "60000"
      SUPPORT_REMINDER_INTERVAL_MS: "60000"
      SUPPORT_CLOSURE_INTERVAL_MS: "60000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # Baked into the build's /api rewrite (Next computes rewrites at build time).
        API_ORIGIN: http://api:3001
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
